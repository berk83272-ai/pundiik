<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beni Seviyor Musun?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: white;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            position: relative;
            padding: 20px;
        }
        #topPhoto {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            display: block;
        }
        #question {
            font-size: clamp(1.6rem, 6vw, 2.3rem);
            font-weight: 700;
            color: #2d3436;
            margin-bottom: 40px;
            text-align: center;
            line-height: 1.3;
            width: 100%;
            max-width: 340px;
            transition: color 0.3s ease;
        }
        #buttons {
            display: flex;
            gap: 24px;
            align-items: center;
            justify-content: center;
            position: relative;
            height: 70px;
            width: 100%;
            max-width: 320px;
        }
        button {
            font-size: 1.35rem;
            padding: 14px 36px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 700;
            box-shadow: 0 5px 18px rgba(0,0,0,0.15);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            white-space: nowrap;
        }
        #yesBtn {
            background: #00c853;
            color: white;
            position: relative;
            z-index: 2;
        }
        #yesBtn:hover, #yesBtn:active {
            transform: scale(1.1);
            box-shadow: 0 7px 22px rgba(0, 200, 83, 0.45);
        }
        #noBtn {
            background: #ff1744;
            color: white;
            position: absolute;
            left: 55%;
            top: 0;
            transition: left 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        top 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                        transform 0.2s ease;
            z-index: 10;
        }
        #result {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 16px;
            width: 100%;
            max-width: 360px;
        }
        #result h1 {
            font-size: clamp(1.4rem, 5.5vw, 1.9rem);
            color: #e84393;
            margin-bottom: 18px;
            line-height: 1.3;
        }
        #photoContainer {
            width: 100%;
            margin: 12px 0;
        }
        #photoContainer img {
            width: 100%;
            max-width: 280px;
            height: auto;
            border-radius: 18px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            display: block;
            margin: 0 auto;
        }
        .hearts {
            position: absolute;
            font-size: 1.8rem;
            animation: floatUp 3s ease-in forwards;
            pointer-events: none;
            z-index: 100;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100vh) scale(1.5); }
        }

        /* Küçük ekranlar için ekstra ayar */
        @media (max-width: 380px) {
            #topPhoto {
                width: 130px;
                height: 130px;
            }
            button {
                font-size: 1.2rem;
                padding: 12px 28px;
            }
            #buttons {
                gap: 16px;
            }
        }
    </style>
</head>
